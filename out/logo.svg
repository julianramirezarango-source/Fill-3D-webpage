<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 87" fill="none">
  <!-- Isometric 3D cube — Fill-3D brand mark -->
  <!-- Top face -->
  <polygon points="50,0 100,25 50,50 0,25" fill="#7C54F0"/>
  <!-- Left face -->
  <polygon points="0,25 0,62 50,87 50,50" fill="#5E33D9"/>
  <!-- Right face -->
  <polygon points="100,25 100,62 50,87 50,50" fill="#3E21A8"/>
  <!-- Subtle edges -->
  <polyline points="50,0 0,25 0,62 50,87 100,62 100,25 50,0" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" stroke-linejoin="round"/>
  <line x1="50" y1="50" x2="50" y2="87" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="0" y1="25" x2="50" y2="50" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="100" y1="25" x2="50" y2="50" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
</svg>
