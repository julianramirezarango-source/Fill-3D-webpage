<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Fill-3D logo: two thick L-brackets forming a 3D box outline -->
  <!-- Upper-left L-bracket: top bar + left bar -->
  <polygon points="8,8 92,8 92,30 30,30 30,92 8,92" fill="#5E33D9"/>
  <!-- Lower-right L-bracket overlay (creates the inner void for 3D cube look) -->
  <polygon points="30,30 92,30 92,92 30,92" fill="white"/>
  <!-- Right bar bottom + right portion -->
  <polygon points="70,30 92,30 92,92 70,92" fill="#5E33D9"/>
  <!-- Bottom bar -->
  <polygon points="30,70 92,70 92,92 30,92" fill="#5E33D9"/>
</svg>
